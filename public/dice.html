<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lắc Xúc Xắc</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #17212b;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .bowl-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 30px;
        }
        .dice-box {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 1;
        }
        .dice {
            width: 50px;
            height: 50px;
            background-color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            color: black;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .bowl {
            position: absolute;
            top: 0;
            width: 200px;
            height: 150px;
            background: linear-gradient(135deg, #4a4a4a, #2a2a2a);
            border-radius: 0 0 100px 100px;
            z-index: 2;
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border: 2px solid #555;
            border-top: none;
        }
        /* Hiệu ứng mở chén */
        .bowl.open {
            transform: translateY(-150px) rotateX(45deg);
        }
        .btn {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #2b5278;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <h2 id="status">Chén đang úp...</h2>
    
    <div class="bowl-container">
        <div class="dice-box" id="diceBox">
            <div class="dice">?</div>
            <div class="dice">?</div>
            <div class="dice">?</div>
        </div>
        <div class="bowl" id="bowl"></div>
    </div>

    <button class="btn" id="revealBtn" onclick="revealDice()">MỞ CHÉN</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const diceEmojis = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
        const urlParams = new URLSearchParams(window.location.search);
        const forcedTotal = parseInt(urlParams.get('force'));
        const amount = urlParams.get('amount');
        const choice = urlParams.get('choice');
        const betId = urlParams.get('betId'); // ID của lượt cược

        let d1, d2, d3;

        if (!isNaN(forcedTotal)) {
            do {
                d1 = Math.floor(Math.random() * 6) + 1;
                d2 = Math.floor(Math.random() * 6) + 1;
                d3 = Math.floor(Math.random() * 6) + 1;
            } while (d1 + d2 + d3 !== forcedTotal);
        } else {
            d1 = Math.floor(Math.random() * 6) + 1;
            d2 = Math.floor(Math.random() * 6) + 1;
            d3 = Math.floor(Math.random() * 6) + 1;
        }

        // Tự động hiện nút mở chén sau 1 giây
        setTimeout(() => {
            document.getElementById('status').innerText = "Bấm nút để mở chén!";
            document.getElementById('revealBtn').style.display = 'block';
        }, 1000);

        function revealDice() {
            document.getElementById('revealBtn').style.display = 'none';
            document.getElementById('status').innerText = "Đang mở...";
            
            const bowl = document.getElementById('bowl');
            bowl.classList.add('open');

            // Đổi mặt xúc xắc
            const diceBox = document.getElementById('diceBox').children;
            diceBox[0].innerText = diceEmojis[d1];
            diceBox[1].innerText = diceEmojis[d2];
            diceBox[2].innerText = diceEmojis[d3];

            const total = d1 + d2 + d3;
            const result = total >= 11 ? 'tai' : 'xiu';
            
            document.getElementById('status').innerText = `Tổng: ${total} điểm (${total >= 11 ? 'TÀI' : 'XỈU'})`;

            // Gửi kết quả về bot
            tg.sendData(JSON.stringify({
                total: total,
                result: result,
                amount: amount,
                choice: choice,
                betId: betId
            }));

            setTimeout(() => {
                tg.close();
            }, 2000);
        }
    </script>
</body>
</html>
